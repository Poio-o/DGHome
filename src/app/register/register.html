<!-- Shell -->
<div class="auth-shell">

  <!-- Header -->
  <header class="header">
    <div class="logo-wrap" aria-label="DigiWorld Logo">
      <app-icon name="logo-dino" class="logo-svg" />
    </div>

    <div class="banner-placeholder" aria-label="Banner de eventos">
      <app-icon name="banner" class="banner-icon" />
      <span class="banner-text">Banner</span>
    </div>

    <nav class="nav-buttons" role="navigation" aria-label="Menú principal">
      <button class="nav-btn">Digimon</button>
      <button class="nav-btn">Digipedia</button>
      <button class="nav-btn">Tienda</button>
      <button class="nav-btn">Objetos</button>
    </nav>
  </header>

  <!-- Body -->
  <div class="body-layout">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Barra lateral">
      <button class="sidebar-btn" aria-label="Inicio">
        <app-icon name="home" />
      </button>
      <button class="sidebar-btn" aria-label="Perfil">
        <app-icon name="user" />
      </button>
      <button class="sidebar-btn" aria-label="Configuración">
        <app-icon name="settings" />
      </button>
    </aside>

    <!-- Main -->
    <main class="auth-main">

      <!-- Register Card -->
      <div class="auth-card">
        <h1 class="auth-title">DigiHome</h1>

        <div class="form-group">
          <input
            type="text"
            class="auth-input"
            placeholder="Enter username"
            [(ngModel)]="username"
          />
          <app-icon name="user" class="input-icon" />
        </div>

        <div class="form-group">
          <input
            type="email"
            class="auth-input"
            placeholder="Enter email"
            [(ngModel)]="email"
          />
          <app-icon name="mail" class="input-icon" />
        </div>

        <div class="form-group">
          <input
            type="password"
            class="auth-input"
            placeholder="Enter password"
            [(ngModel)]="password"
          />
          <app-icon name="lock" class="input-icon" />
        </div>

        <div class="form-group">
          <input
            type="password"
            class="auth-input"
            placeholder="Enter password again"
            [(ngModel)]="passwordAgain"
          />
          <app-icon name="lock" class="input-icon" />
        </div>

        <div class="auth-links">
          <button class="link-btn" (click)="goToLogin()">Login</button>
          <button class="link-btn link-right">Forgot password?</button>
        </div>

        <button class="auth-submit-btn" (click)="onRegister()">Register</button>
      </div>

    </main>
  </div>
</div>

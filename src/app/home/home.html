<!-- Shell -->
<div class="page-wrapper">

  <!-- Header -->
  <header class="header">

    <div class="logo-wrap" aria-label="DGHome Logo">
      <app-icon name="logo-dino" class="logo-svg" />
    </div>

    <div class="banner-placeholder" aria-label="Banner de eventos">
      <img src="/assets/banner.png" alt="BANNER" class="banner-img" />
    </div>

    <!-- Nav buttons -->
    <nav class="nav-buttons" role="navigation" aria-label="Menú principal">
      <button class="nav-btn" id="btn-digimon" routerLink="/digimon">Digimon</button>
      <button class="nav-btn" id="btn-digipedia">Digipedia</button>
      <button class="nav-btn" id="btn-tienda">Tienda</button>
      <button class="nav-btn" id="btn-objetos" routerLink="/inventory">Objetos</button>
    </nav>

  </header>

  <!-- Body -->
  <div class="body-layout">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Barra lateral">

      <button class="sidebar-btn" id="btn-inicio" type="button" aria-label="Inicio" aria-current="page" routerLink="/home">
        <app-icon name="home" />
      </button>

      <button class="sidebar-btn" id="btn-perfil" type="button" aria-label="Perfil" routerLink="/profile">
        <app-icon name="user" />
      </button>

      <button class="sidebar-btn" id="btn-notif" aria-label="Notificaciones">
        <app-icon name="bell" />
      </button>

      <button class="sidebar-btn" id="btn-mensajes" aria-label="Mensajes">
        <app-icon name="mail" />
      </button>

      <button class="sidebar-btn" id="btn-config" type="button" aria-label="Configuración" routerLink="/settings">
        <app-icon name="settings" />
      </button>

    </aside>

    <!-- Farm Container -->
    <main class="main-content" id="main-map" aria-label="Granja Interactiva 2D">
      <div class="farm-container">
        <app-farm-toolbar />

        <app-farm-canvas />

        <app-farm-digimon-modal />
      </div>
    </main>

  </div>

</div>

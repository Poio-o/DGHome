<!-- Shell -->
<div class="page-wrapper">

  <!-- Header -->
  <header class="header">

    <div class="logo-wrap" aria-label="DigiWorld Logo">
      <app-icon name="logo-dino" class="logo-svg" />
    </div>

    <div class="banner-placeholder" aria-label="Banner de eventos">
      <app-icon name="banner" class="banner-icon" />
      <span class="banner-text">Banner</span>
    </div>

    <!-- Nav buttons -->
    <nav class="nav-buttons" role="navigation" aria-label="Menú principal">
      <button class="nav-btn" id="btn-digimon">Digimon</button>
      <button class="nav-btn" id="btn-digipedia">Digipedia</button>
      <button class="nav-btn" id="btn-tienda">Tienda</button>
      <button class="nav-btn" id="btn-objetos">Objetos</button>
    </nav>

  </header>

  <!-- Body -->
  <div class="body-layout">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Barra lateral">

      <button class="sidebar-btn" id="btn-perfil" aria-label="Perfil">
        <app-icon name="user" />
      </button>

      <button class="sidebar-btn" id="btn-notif" aria-label="Notificaciones">
        <app-icon name="bell" />
      </button>

      <button class="sidebar-btn" id="btn-mensajes" aria-label="Mensajes">
        <app-icon name="mail" />
      </button>

      <button class="sidebar-btn" id="btn-config" aria-label="Configuración">
        <app-icon name="settings" />
      </button>

    </aside>

    <!-- Main -->
    <main class="main-content" id="main-map" aria-label="Mapa del mundo">
      <div class="map-placeholder">
        <app-icon name="map" class="map-icon" />
        <span class="map-text">Mapa</span>
      </div>
    </main>

  </div>

</div>
